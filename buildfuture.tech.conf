server {
    listen 80;
    server_name buildfuture.tech www.buildfuture.tech;

    # Allow large uploads if needed (e.g. video files for analysis)
    client_max_body_size 50M;

    # Dify Workflow forwarding
    location ~* ^/dify {
        return 302 https://udify.app/workflow/H3Rk13uw0pSMHsbB;
    }

    # Redirect root to /veriflow-antirumor/
    location = / {
        return 302 /veriflow-antirumor/;
    }

    # CogniScaffold subpath application
    location /cogni-scaffold {
        proxy_pass http://172.17.0.1:8501;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_http_version 1.1;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        add_header Cache-Control no-cache;
    }

    # VeriFlow Anti-Rumor subpath application
    location /veriflow-antirumor {
        proxy_pass http://172.17.0.1:3001; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header REMOTE-HOST $remote_addr; 
        proxy_set_header Upgrade $http_upgrade; 
        proxy_set_header Connection $http_connection; 
        proxy_set_header X-Forwarded-Proto $scheme; 
        proxy_set_header X-Forwarded-Port $server_port; 
        proxy_http_version 1.1; 
        
        # Disable caching for SPA
        add_header Cache-Control no-cache; 
    }

    # Fallback proxy for direct root paths or API backward-compatibility
    location / {
        proxy_pass http://172.17.0.1:3001; 
        proxy_set_header Host $host; 
        proxy_set_header X-Real-IP $remote_addr; 
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; 
        proxy_set_header REMOTE-HOST $remote_addr; 
        proxy_set_header Upgrade $http_upgrade; 
        proxy_set_header Connection $http_connection; 
        proxy_set_header X-Forwarded-Proto $scheme; 
        proxy_set_header X-Forwarded-Port $server_port; 
        proxy_http_version 1.1; 
        
        add_header Cache-Control no-cache; 
    }
}
